<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font stylesheet: loads with low priority (media="print"),
         then swaps to "all" once fetched so it doesn't delay first paint. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=Permanent+Marker&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=Permanent+Marker&display=swap"
      />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#221E1A" />
    <title>READY: Explore Careers. Experience The Real World.</title>
    <meta
      name="description"
      content="READY gets students out of the classroom and into real careers through career camps, experience days, internships and competitions built on real exposure."
    />

    <!-- Open Graph / social share preview.
         ACTION NEEDED AFTER DEPLOY: og:url and og:image below still say
         "your-vercel-project.vercel.app" — once this is deployed on
         Vercel, replace that with the actual *.vercel.app URL Vercel
         assigns (or your custom domain, if you add one later). Same
         change needed in the canonical link tag and in
         public/sitemap.xml. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="READY" />
    <meta property="og:title" content="READY: Explore Careers. Experience The Real World." />
    <meta
      property="og:description"
      content="READY gets students out of the classroom and into real careers through career camps, experience days, internships and competitions built on real exposure."
    />
    <meta property="og:url" content="https://your-vercel-project.vercel.app/" />
    <meta property="og:image" content="https://your-vercel-project.vercel.app/logo-mark.png" />
    <link rel="canonical" href="https://your-vercel-project.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="READY: Explore Careers. Experience The Real World." />
    <meta
      name="twitter:description"
      content="READY gets students out of the classroom and into real careers through career camps, experience days, internships and competitions built on real exposure."
    />
    <meta name="twitter:image" content="https://your-vercel-project.vercel.app/logo-mark.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
